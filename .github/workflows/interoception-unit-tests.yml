name: Interoception unit tests

on:
  push:
    branches:
      - virtual-body-interoception-v0.1
      - virtual-body-homeostasis-v0.2
    paths:
      - "lib/organism/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/interoception-unit-tests.yml"
  pull_request:
    paths:
      - "lib/organism/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/interoception-unit-tests.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "numpy>=1.26"

      - name: Run complete CPU test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"
