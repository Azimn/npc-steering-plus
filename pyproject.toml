[project]
name = "driver-affect-sim"
version = "0.2.0"
description = "Persistent virtual-body and activation-steering research substrate for generative agents."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.30",
  "mlx-lm>=0.30",
  "numpy>=1.26",
]
hf = [
  "huggingface-hub>=0.20",
  "transformers>=4.40",
  "torch>=2.2",
  "numpy>=1.26",
]
sim = [
  "highway-env>=1.10",
  "gymnasium>=0.29",
  "numpy>=1.26",
]
viz = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]
audit = [
  "huggingface-hub>=0.20",
  "transformers>=4.40",
  "torch>=2.2",
  "onnxruntime>=1.17",
  "soundfile>=0.12",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lib*"]
